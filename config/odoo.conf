[options]
addons_path = /opt/odoo/addons,/opt/odoo/custom-addons/l10n-brazil,/opt/odoo/custom-addons/account-financial-tools
data_dir = /var/lib/odoo
admin_passwd = ${ODOO_ADMIN_PASSWORD}
db_host = db
db_port = 5432
db_user = ${ODOO_DB_USER}
db_password = ${ODOO_DB_PASSWORD}
proxy_mode = True
workers = 4
max_cron_threads = 1
limit_memory_soft = 2147483648   ; 2GB (adjust based on your server)
limit_memory_hard = 2684354560   ; 2.5GB
limit_time_cpu = 600
limit_time_real = 1200
logfile = /var/log/odoo/odoo.log
