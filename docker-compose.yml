version: "3.8"

services:
  postgres13:
    image: postgres:13
    restart: unless-stopped
    env_file: myenvfile.env
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data

  odoo16_01:
    build: .
    depends_on:
      - db
    restart: unless-stopped
    env_file: myenvfile.env
    environment:
      - HOST=db
      - USER=${ODOO_DB_USER}
      - PASSWORD=${ODOO_DB_PASSWORD}
    volumes:
      - ./config/odoo.conf:/etc/odoo/odoo.conf
      - ./data/filestore:/var/lib/odoo
      - ./logs/odoo:/var/log/odoo
      - ./addons:/opt/odoo/custom-addons
      - ./odoo:/opt/odoo
    expose:
      - "8069"
      - "8072"

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/odoo.conf:/etc/nginx/conf.d/default.conf

volumes:
  pgdata:
