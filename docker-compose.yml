version: "3.8"

services:
  db:
    image: postgres:13
    restart: unless-stopped
    env_file: .env
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data

  odoo:
    build: .
    depends_on:
      - db
    restart: unless-stopped
    env_file: .env
    environment:
      - HOST=db
      - USER=${ODOO_DB_USER}
      - PASSWORD=${ODOO_DB_PASSWORD}
    volumes:
      - ./config/odoo.conf:/etc/odoo/odoo.conf
      - ./data/filestore:/var/lib/odoo
      - ./logs/odoo:/var/log/odoo
      - ./addons:/opt/odoo/custom-addons
      - ./odoo:/opt/odoo
    expose:
      - "8069"
      - "8072"

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - odoo
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/odoo.conf:/etc/nginx/conf.d/default.conf
      - certbot-www:/var/www/certbot
      - certbot-etc:/etc/letsencrypt

  certbot:
    image: certbot/certbot
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-www:/var/www/certbot

volumes:
  db-data:
  certbot-etc:
  certbot-www:
